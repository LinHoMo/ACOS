// ACOS Cognitive Intermediate Representation (CIR) v0.1
//
// CIR bridges task understanding and executable graph generation. It is the
// stable contract between the compiler and the runtime.
//
// See docs/specs/cir_spec.md

syntax = "proto3";

package acos.cir.v1;

option csharp_namespace = "Acos.Cir.V1";
option go_package = "acos/cir/v1;cirv1";
option java_package = "io.acos.cir.v1";

// A compiled cognitive program (the CIR).
message CirProgram {
  string id = 1;
  string task_id = 2;
  repeated string entry = 3;
  repeated CirNode nodes = 4;
  repeated EffectDecl effects = 5;
}

// A node kind.
enum CirNodeKind {
  CIR_NODE_KIND_UNSPECIFIED = 0;
  CIR_NODE_KIND_PRIMITIVE_INVOCATION = 1;
  CIR_NODE_KIND_SEQUENCE = 2;
  CIR_NODE_KIND_PARALLEL = 3;
  CIR_NODE_KIND_CONDITIONAL = 4;
  CIR_NODE_KIND_LOOP_MAP = 5;
  CIR_NODE_KIND_RETRY = 6;
  CIR_NODE_KIND_CHECKPOINT = 7;
  CIR_NODE_KIND_VERIFICATION = 8;
  CIR_NODE_KIND_ARTIFACT_REF = 9;
}

// A single node in the CIR graph.
message CirNode {
  CirNodeKind kind = 1;
  string node_id = 2;
  optional string primitive_id = 3;
  optional string output = 4;
  repeated string children = 5;
  // False branch for conditional nodes (true branch is `children`). P0.
  repeated string else_children = 6;
  // Control semantics (condition / loop / retry), distinct from `inputs`. P0.
  ControlSpec control = 7;
}

// An effect kind.
enum EffectKind {
  EFFECT_KIND_UNSPECIFIED = 0;
  EFFECT_KIND_FS_READ = 1;
  EFFECT_KIND_FS_WRITE = 2;
  EFFECT_KIND_NETWORK_READ = 3;
  EFFECT_KIND_NETWORK_WRITE = 4;
  EFFECT_KIND_PROCESS_SPAWN = 5;
  EFFECT_KIND_SECRET_READ = 6;
  EFFECT_KIND_EXTERNAL_IRREVERSIBLE = 7;
}

// A declared effect with its compensation info.
message EffectDecl {
  EffectKind kind = 1;
  string description = 2;
  bool reversible = 3;
}

// ── Control semantics (P0) ───────────────────────────────────────────────────

// Control semantics attached to a node — distinct from business `inputs`.
message ControlSpec {
  ConditionSpec condition = 1; // for conditional nodes
  LoopSpec loop_spec = 2;     // for loop_map nodes
  RetryPolicy retry = 3;      // retry policy for any executable node
}

// Condition expression for a conditional node (acos-expr safe subset).
message ConditionSpec {
  string expression = 1;
}

// Loop kind for a loop_map node.
enum LoopKind {
  LOOP_KIND_UNSPECIFIED = 0;
  LOOP_KIND_WHILE = 1;   // evaluate condition first; run body while true
  LOOP_KIND_UNTIL = 2;   // run body first; exit when condition true
  LOOP_KIND_FOR_EACH = 3; // iterate over an env list, binding item_var
}

// Loop configuration for a loop_map node.
message LoopSpec {
  LoopKind kind = 1;
  optional string condition = 2;     // while/until condition expression
  optional uint32 max_iterations = 3; // required for while/until (>= 1); for_each: null = whole list
  optional string input = 4;         // for_each: env reference to the input list
  optional string item_var = 5;      // for_each: iteration variable bound in env
}

// Retry strategy.
enum RetryStrategy {
  RETRY_STRATEGY_UNSPECIFIED = 0;
  RETRY_STRATEGY_FIXED = 1;
}

// Failure class used to decide retry/recovery behavior.
enum FailureClass {
  FAILURE_CLASS_UNSPECIFIED = 0;
  FAILURE_CLASS_TIMEOUT = 1;
  FAILURE_CLASS_RATE_LIMIT = 2;
  FAILURE_CLASS_TRANSIENT_NETWORK_ERROR = 3;
  FAILURE_CLASS_INVALID_INPUT = 4;
  FAILURE_CLASS_PERMISSION_DENIED = 5;
  FAILURE_CLASS_SYNTAX_ERROR = 6;
  FAILURE_CLASS_UNKNOWN = 7;
}

// Retry policy attached via ControlSpec.retry.
message RetryPolicy {
  uint32 max_attempts = 1;          // total attempts incl. first; must be >= 1
  uint64 backoff_ms = 2;            // delay between attempts (ms)
  RetryStrategy strategy = 3;       // fixed delay (MVP)
  repeated FailureClass retry_on = 4; // classes to retry; empty = all retryable
}
