[package]
name = "acos-compiler"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "ACOS cognitive compiler: rule-first planner that turns task specs into CIR programs."

[dependencies]
acos-core = { path = "../acos-core" }
acos-plugin = { path = "../acos-plugin" }
async-trait = "0.1"
serde_json = "1"

[features]
default = ["in-memory"]
in-memory = ["acos-plugin/in-memory"]

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
