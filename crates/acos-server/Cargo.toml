[package]
name = "acos-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "ACOS web server: HTTP API + static UI for the ACOS agent."

[dependencies]
acos-core = { path = "../acos-core" }
acos-compiler = { path = "../acos-compiler" }
acos-runtime = { path = "../acos-runtime" }
acos-state = { path = "../acos-state" }
acos-plugin = { path = "../acos-plugin" }
acos-verify = { path = "../acos-verify" }
acos-llm = { path = "../acos-llm" }
# NOTE: `compress` 默认特性会经 actix-http 拉入 zstd-sys / brotli-sys（C 库，
# 需要本机 C 编译器）。本仓库 CI/构建环境无 gcc，故关闭 compress 以解锁构建。
# 服务端仅提供 JSON API + 静态文件，无需响应压缩。
actix-web = { version = "4", default-features = false, features = ["macros", "http2"] }
actix-files = { version = "0.6", default-features = false }
dotenvy = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
uuid = { version = "1", features = ["v4"] }

[features]
default = ["in-memory"]
in-memory = ["acos-runtime/in-memory", "acos-state/in-memory", "acos-plugin/in-memory"]

[[bin]]
name = "acos-server"
path = "src/main.rs"
