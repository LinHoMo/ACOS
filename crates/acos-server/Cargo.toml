[package]
name = "acos-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "ACOS web server: HTTP API + static UI for the ACOS agent."

[dependencies]
acos-core = { path = "../acos-core" }
acos-compiler = { path = "../acos-compiler" }
acos-runtime = { path = "../acos-runtime" }
acos-state = { path = "../acos-state" }
acos-plugin = { path = "../acos-plugin" }
acos-verify = { path = "../acos-verify" }
acos-llm = { path = "../acos-llm" }
actix-web = "4"
actix-files = "0.6"
dotenvy = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
uuid = { version = "1", features = ["v4"] }

[features]
default = ["in-memory"]
in-memory = ["acos-runtime/in-memory", "acos-state/in-memory", "acos-plugin/in-memory"]

[[bin]]
name = "acos-server"
path = "src/main.rs"
