[package]
name = "acos-plugin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "ACOS built-in cognitive primitives and the plugin registry."

[dependencies]
acos-core = { path = "../acos-core" }
acos-state = { path = "../acos-state" }
async-trait = "0.1"
serde_json = "1"
tokio = { version = "1", features = ["process", "fs"] }

[features]
default = ["in-memory"]
in-memory = ["acos-state/in-memory"]
