[package]
name = "acos-state"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "ACOS state stores: event log, artifact store, and in-memory/SQLite implementations."

[dependencies]
acos-core = { path = "../acos-core" }
async-trait = "0.1"
serde_json = "1"
tokio = { version = "1", features = ["sync"] }

[features]
default = ["in-memory"]
in-memory = []
sqlite = []
