[package]
name = "acos-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "ACOS cognitive runtime: executes CIR programs durably with compensation."

[dependencies]
acos-core = { path = "../acos-core" }
acos-state = { path = "../acos-state" }
acos-plugin = { path = "../acos-plugin" }
async-trait = "0.1"
serde_json = "1"
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros"] }
acos-compiler = { path = "../acos-compiler" }
[features]
default = ["in-memory"]
in-memory = ["acos-state/in-memory", "acos-plugin/in-memory"]
[dev-dependencies]
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
acos-compiler = { path = "../acos-compiler" }
