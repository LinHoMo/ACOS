[package]
name = "acos-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "ACOS core types, traits, errors, and schema primitives — the shared foundation for all other crates."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
insta = { version = "1", features = ["json", "yaml", "redactions"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[features]
default = []
# Isolates the experience → compiler feedback loop (Phase 3+).
experience-feedback = []
