[package]
name = "acos-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "ACOS core types, traits, errors, and schema primitives — the shared foundation for all other crates."

[dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
insta = { version = "1", features = ["json", "yaml", "redactions"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
acos-compiler = { path = "../acos-compiler" }
acos-runtime = { path = "../acos-runtime" }
acos-state = { path = "../acos-state" }
acos-plugin = { path = "../acos-plugin" }
acos-verify = { path = "../acos-verify" }

[features]
default = []
# Isolates the experience → compiler feedback loop (Phase 3+).
experience-feedback = []
