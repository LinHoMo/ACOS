[package]
name = "acos-baseline"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "ACOS P1 baseline agents: direct tool-loop and fixed workflow."

[dependencies]
acos-core = { path = "../acos-core" }
acos-llm = { path = "../acos-llm" }
acos-verify = { path = "../acos-verify" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "process"] }
chrono = { version = "0.4", features = ["serde"] }

[features]
default = []